[project]
name = "numpy-cnn"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "jupyterlab>=4.5.7",
    "numpy>=2.4.5",
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "torch>=2.12.0",
    "torchvision>=0.17.0",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu129", marker = "sys_platform != 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cu129", marker = "sys_platform != 'win32'" },
]

[tool.uv]
environments = ["sys_platform == 'win32'"]

